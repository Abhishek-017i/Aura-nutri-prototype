name: Keep Backend Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -f -s https://aura-nutri-prototype.onrender.com/Health || echo "Ping failed, server might be waking up"